{% extends "base.html" %}
{% block titulo %}Receita — {{ paciente.nome }}{% endblock %}
{% block conteudo %}
<script src="/static/posologia.js"></script>
<div class="cartao">
  <h1>Nova receita — {{ paciente.nome }}</h1>
  <form method="post" action="/pacientes/{{ paciente.id }}/receita" id="form-receita">
    <label>Diagnósticos-chave do paciente (2-3, separados por vírgula — viram busca e estatística)</label>
    <input type="text" name="tags" value="{{ paciente.tags or '' }}"
           placeholder="ex.: astrocitoma, epilepsia focal estrutural">

    <div class="linha">
      <div>
        <label>Tipo de receituário</label>
        <div class="radio-grupo">
          <label><input type="radio" name="tipo" value="controle_especial" checked>
            <span>Controle especial</span></label>
          <label><input type="radio" name="tipo" value="comum">
            <span>Comum</span></label>
        </div>
      </div>
      <div>
        <label>Data</label>
        <div class="radio-grupo">
          <label><input type="radio" name="com_data" value="sem" checked
                        onchange="toggleVias()">
            <span>SEM data (sai sem campo de data)</span></label>
          <label><input type="radio" name="com_data" value="com" onchange="toggleVias()">
            <span>COM data ({{ hoje }})</span></label>
        </div>
      </div>
      <div id="bloco-vias" style="max-width:240px">
        <label>Retorno do paciente em</label>
        <select id="meses-retorno" onchange="guiaFolhas()">
          {% for v in range(1, 13) %}
          <option value="{{ v }}">{{ v }} {{ "mês" if v == 1 else "meses" }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div id="guia-folhas" class="aviso"></div>
    <input type="hidden" name="vias" id="campo-vias" value="1">

    <label>Via de administração</label>
    <select name="via_administracao">
      <option>USO ORAL</option>
      <option>USO TÓPICO</option>
      <option>USO SUBCUTÂNEO</option>
      <option>USO INTRAMUSCULAR</option>
      <option>USO ENDOVENOSO, EM BOMBA DE INFUSÃO CONTÍNUA (BIC)</option>
    </select>

    <h2>Medicamentos</h2>
    <div id="itens"></div>
    <p><button type="button" class="botao secundario" onclick="novaLinha()">+ Adicionar medicamento</button></p>

    <div id="avisos"></div>
    {% include "_carimbo.html" %}
    <input type="hidden" name="itens_json" id="itens_json">
    <p style="margin-top:18px">
      <button class="botao" type="submit" name="acao" value="gerar">Gerar PDF da receita</button>
      <button class="botao secundario" type="submit" name="acao" value="salvar"
              title="Fica no histórico do paciente; o PDF é gerado quando você abrir">
        Deixar salvo (gerar depois)</button>
      <a class="botao secundario" href="/pacientes/{{ paciente.id }}">Cancelar</a>
    </p>
  </form>
</div>

<template id="tpl-item">
  <div class="item-med">
    <div class="linha">
      <div style="flex:2">
        <label>Medicamento</label>
        <input type="text" class="busca-med" list="lista-meds" placeholder="Digite para buscar…">
      </div>
      <div>
        <label>Apresentação</label>
        <select class="sel-apr"></select>
      </div>
      <div style="max-width:170px">
        <label>Quantidade</label>
        <input type="text" class="qtd" placeholder="ex.: 60 comprimidos">
      </div>
    </div>
    <label>Posologia (clique numa sugestão ou edite)</label>
    <div class="chips"></div>
    <input type="text" class="posologia" placeholder="Tomar …">
    <p style="text-align:right; margin:6px 0 0">
      <button type="button" class="chip" onclick="this.closest('.item-med').remove()">remover</button>
    </p>
  </div>
</template>
<datalist id="lista-meds"></datalist>

<script>
function toggleVias() {
  const sem = document.querySelector('input[name=com_data][value=sem]').checked;
  document.getElementById('bloco-vias').style.display = sem ? 'block' : 'none';
  guiaFolhas();
}
// Guia instrutivo (para qualquer um da equipe saber quantas folhas imprimir):
// - Controle especial: a farmácia RETÉM 1 via -> 2 folhas por mês de tratamento.
// - Receita comum (UBS/uso contínuo): vale 2 meses -> 1 folha a cada 2 meses.
// - COM data: só cobre o mês atual (controlada = 2 folhas; comum = 1).
function guiaFolhas() {
  const controlada = document.querySelector('input[name=tipo]:checked').value === 'controle_especial';
  const semData = document.querySelector('input[name=com_data][value=sem]').checked;
  const meses = parseInt(document.getElementById('meses-retorno').value);
  let folhas, texto;
  if (!semData) {
    folhas = controlada ? 2 : 1;
    texto = controlada
      ? 'COM data: sai <b>2 folhas iguais</b> (1ª via fica retida na farmácia, 2ª via do paciente). Vale 30 dias.'
      : 'COM data: sai <b>1 folha</b>. Receita comum de uso contínuo vale por 2 meses na UBS.';
  } else if (controlada) {
    folhas = meses * 2;
    texto = `Receita CONTROLADA vale 30 dias e a farmácia retém 1 via: para ${meses} ` +
            `${meses === 1 ? 'mês' : 'meses'} até o retorno saem <b>${folhas} folhas</b> ` +
            `(2 iguais por mês, sem data — o paciente data no mês da retirada).`;
  } else {
    folhas = Math.ceil(meses / 2);
    texto = `Receita COMUM (UBS) vale 2 meses: para ${meses} ` +
            `${meses === 1 ? 'mês' : 'meses'} até o retorno ${folhas === 1 ? 'basta' : 'bastam'} ` +
            `<b>${folhas} folha${folhas > 1 ? 's' : ''}</b> sem data.`;
  }
  document.getElementById('campo-vias').value = folhas;
  document.getElementById('guia-folhas').innerHTML = '🖨️ ' + texto;
}
document.querySelectorAll('input[name=tipo]').forEach(r => r.addEventListener('change', guiaFolhas));
let CATALOGO = [];
const PAYLOAD_ANTERIOR = {{ payload_anterior | tojson if payload_anterior else 'null' }};

fetch('/api/catalogo').then(r => r.json()).then(c => {
  CATALOGO = c;
  const dl = document.getElementById('lista-meds');
  dl.innerHTML = c.map(m => `<option value="${m.principio_ativo}">`).join('');
  iniciar();
  guiaFolhas();
});

function medPorNome(nome) {
  return CATALOGO.find(m => m.principio_ativo.toLowerCase() === nome.trim().toLowerCase());
}

function novaLinha(dados) {
  const el = document.getElementById('tpl-item').content.cloneNode(true).firstElementChild;
  document.getElementById('itens').appendChild(el);
  const busca = el.querySelector('.busca-med');
  const selApr = el.querySelector('.sel-apr');
  const chips = el.querySelector('.chips');
  const qtd = el.querySelector('.qtd');
  const pos = el.querySelector('.posologia');

  function atualizarApresentacoes() {
    const med = medPorNome(busca.value);
    selApr.innerHTML = '';
    chips.innerHTML = '';
    mostrarAvisos(med);
    if (!med) return;
    for (const a of med.apresentacoes) {
      const o = document.createElement('option');
      o.value = o.textContent = `${a.dose} - ${a.forma}`;
      selApr.appendChild(o);
    }
    atualizarPosologias();
  }
  function atualizarPosologias() {
    const med = medPorNome(busca.value);
    chips.innerHTML = '';
    if (!med) return;
    const apr = med.apresentacoes[selApr.selectedIndex];
    if (!apr) return;
    apr.posologias.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = p.texto;
      b.onclick = () => { pos.value = p.texto; qtd.value = p.qtd_30dias || qtd.value;
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('ativa'));
        b.classList.add('ativa'); };
      chips.appendChild(b);
      if (i === 0 && !dados) { pos.value = p.texto; qtd.value = p.qtd_30dias || ''; b.classList.add('ativa'); }
    });
  }
  busca.addEventListener('change', atualizarApresentacoes);
  selApr.addEventListener('change', atualizarPosologias);
  // posologia editada à mão recalcula a quantidade ("3 cp à noite" -> 90/mês)
  pos.addEventListener('input', () => {
    const mensal = qtdMensalDaPosologia(pos.value);
    if (mensal == null) return;
    const med = medNome(busca.value);
    const a = med && med.apresentacoes[selApr.selectedIndex];
    const f = a ? a.forma.toLowerCase() : '';
    const unidade = f.includes('cápsula') ? 'cápsulas' : f.includes('comprimido')
      ? 'comprimidos' : 'unidades';
    qtd.value = `${mensal} ${unidade}`;
  });

  if (dados) {   // pré-preenchimento (repetir receita)
    const partes = dados.medicamento.split(' ');
    busca.value = dados._principio || dados.medicamento;
    atualizarApresentacoes();
    qtd.value = dados.quantidade;
    pos.value = dados.posologia;
    if (dados._apresentacao) selApr.value = dados._apresentacao;
  }
  return el;
}

function mostrarAvisos(med) {
  const div = document.getElementById('avisos');
  div.innerHTML = '';
  document.querySelectorAll('.item-med .busca-med').forEach(inp => {
    const m = medPorNome(inp.value);
    if (!m) return;
    let partes = [];
    const disp = m.disponibilidade || [];
    if (disp.includes('remume')) partes.push('tem no POSTO (REMUME) — receita comum da UBS vale 2 meses');
    if (disp.includes('ceaf')) partes.push('ALTO CUSTO — retirar na Farmácia Especializada com kit LME');
    if (disp.length === 1 && disp[0] === 'comercial') partes.push('só em farmácia comum (compra)');
    if (m.classificacao === 'B1')
      partes.push('exige NOTIFICAÇÃO DE RECEITA B (azul) do talão na farmácia');
    if (m.lme) partes.push('gerar também o kit LME (botão na página do paciente)');
    if (m.obs) partes.push(m.obs);
    if (partes.length)
      div.innerHTML += `<div class="aviso"><b>${m.principio_ativo}:</b> ${partes.join(' · ')}</div>`;
  });
}

function iniciar() {
  if (PAYLOAD_ANTERIOR) {
    const p = JSON.parse(PAYLOAD_ANTERIOR);
    document.querySelector(`input[name=tipo][value=${p.tipo}]`).checked = true;
    if (p.via_administracao)
      document.querySelector('select[name=via_administracao]').value = p.via_administracao;
    (p.itens || []).forEach(i => novaLinha(i));
  } else {
    novaLinha();
  }
}

document.getElementById('form-receita').addEventListener('submit', e => {
  const itens = [];
  document.querySelectorAll('.item-med').forEach(el => {
    const nome = el.querySelector('.busca-med').value.trim();
    if (!nome) return;
    const apr = el.querySelector('.sel-apr').value;
    itens.push({
      medicamento: apr ? `${nome} ${apr}` : nome,
      _principio: nome,
      _apresentacao: apr,
      quantidade: el.querySelector('.qtd').value.trim() || 'USO CONTÍNUO',
      posologia: el.querySelector('.posologia').value.trim(),
    });
  });
  if (!itens.length) { e.preventDefault(); alert('Adicione ao menos um medicamento.'); return; }
  document.getElementById('itens_json').value = JSON.stringify(itens);
});
</script>
{% endblock %}
